.note-label { font-size: 11px; font-weight: 600; color: #aaa; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 20px; margin-bottom: 6px; }

</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="trip-title" contenteditable="true" spellcheck="false" oninput="scheduleSave()">🏕️ La Mauricie 露营计划</h1>
    <div class="header-meta" contenteditable="true" spellcheck="false" oninput="scheduleSave()">Rivière-à-la-Pêche · 6月27–28日 · 4大人 2小孩</div>
    <div class="edit-hint">💡 点击任何文字可直接编辑 · 可新增或删除条目</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('itinerary',this)">📅 行程</button>
    <button class="tab" onclick="switchTab('gear',this)">🎒 装备清单</button>
    <button class="tab" onclick="switchTab('food',this)">🍳 食物计划</button>
    <button class="tab" onclick="switchTab('tips',this)">💡 注意事项</button>
  </div>

  <!-- 导出/导入 -->
  <div class="export-bar">
    <span>💾 备份数据，防止浏览器清除后丢失</span>
    <button class="btn-export" onclick="exportData()">⬇ 导出备份</button>
    <button class="btn-import" onclick="document.getElementById('import-input').click()">⬆ 导入恢复</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
  </div>

  <!-- 行程 -->
  <div id="tab-itinerary" class="panel active">
    <div id="itinerary-days"></div>
    <button class="add-section-btn" onclick="addDay()">＋ 新增一天</button>
    <div class="note-label">备注</div>
    <div id="note-itinerary" class="note-box" contenteditable="true" spellcheck="false" data-placeholder="在这里写行程相关备注…" oninput="notes.itinerary=this.innerText;scheduleSave()"></div>
  </div>

  <!-- 装备 -->
  <div id="tab-gear" class="panel">
    <div class="progress-wrap">
      <div class="progress-header"><span>准备进度</span><span id="gear-pct">0 / 0 项已完成</span></div>
      <div class="progress-bar"><div class="progress-fill" id="gear-fill" style="width:0%"></div></div>
    </div>
    <div class="checklist-grid" id="gear-grid"></div>
    <button class="add-group-btn" onclick="addCheckGroup('gear-grid', gearGroups, true)" style="margin-top:12px">＋ 新增分类</button>
    <br>
    <button class="reset-btn" onclick="resetGear()">↺ 重置所有勾选</button>
    <div class="note-label">备注</div>
    <div id="note-gear" class="note-box" contenteditable="true" spellcheck="false" data-placeholder="在这里写装备相关备注…" oninput="notes.gear=this.innerText;scheduleSave()"></div>
  </div>

  <!-- 食物 -->
  <div id="tab-food" class="panel">
    <div id="food-days-wrap"></div>
    <button class="add-section-btn" onclick="addMealDay()" style="margin-top:8px">＋ 新增一天</button>

    <div class="section-label" style="margin-top:24px">购物清单</div>
    <div id="food-grid"></div>
    <button class="add-group-btn" onclick="addFoodGroup()" style="margin-top:12px">＋ 新增分类</button>

    <div class="note-label">备注</div>
    <div id="note-food" class="note-box" contenteditable="true" spellcheck="false" data-placeholder="在这里写食物相关备注…" oninput="notes.food=this.innerText;scheduleSave()"></div>
  </div>

  <!-- 贴士 -->
  <div id="tab-tips" class="panel">
    <div id="tips-container"></div>
    <button class="add-tip-btn" onclick="addTip()">＋ 新增注意事项</button>
    <div class="note-label">备注</div>
    <div id="note-tips" class="note-box" contenteditable="true" spellcheck="false" data-placeholder="在这里写其他注意事项备注…" oninput="notes.tips=this.innerText;scheduleSave()"></div>
  </div>
</div>

// ── Itinerary ──
function renderItinerary() {
  const wrap = document.getElementById('itinerary-days');
  wrap.innerHTML = '';
  defaultDays.forEach((day, di) => {
    const sec = document.createElement('div');
    sec.dataset.dayIndex = di;
    sec.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-top:${di===0?'0':'20px'};margin-bottom:10px">
      <span class="section-label" style="margin:0;flex:1" contenteditable="true" spellcheck="false" oninput="defaultDays[${di}].label=this.innerText.trim();scheduleSave()">${day.label}</span>
      <button class="del-btn" style="font-size:14px;color:#ddd" title="删除这一天" onclick="removeDay(${di})">✕</button>
    </div>
    <div class="timeline" id="tl-${di}"></div>
    <button class="add-event-btn" onclick="addEvent(${di})">＋ 新增活动</button>`;
    wrap.appendChild(sec);
    day.events.forEach((ev, ei) => renderEvent(di, ei, ev));
  });
}

function renderEvent(di, ei, ev) {
  const tl = document.getElementById('tl-' + di);
  const item = document.createElement('div');
  item.className = 'tl-item';
  item.dataset.ei = ei;
  item.dataset.di = di;
  item.draggable = true;

  item.innerHTML = `
    <span class="drag-handle" title="拖动排序">⠿</span>
    <span class="tl-time" contenteditable="true" spellcheck="false" oninput="saveEvent(${di},${ei},this.closest('.tl-item'))">${ev.time}</span>
    <div class="tl-card">
      <div class="tl-title" contenteditable="true" spellcheck="false" oninput="saveEvent(${di},${ei},this.closest('.tl-item'))">${ev.title}</div>
      <div class="tl-desc" contenteditable="true" spellcheck="false" oninput="saveEvent(${di},${ei},this.closest('.tl-item'))">${ev.desc}</div>

    </div>
    <button class="del-btn" title="删除">✕</button>`;
  item.querySelector('.del-btn').addEventListener('click', () => {
    const idx = defaultDays[di].events.indexOf(ev);
    if (idx > -1) defaultDays[di].events.splice(idx, 1);
    item.remove();
    saveToLocal();
  });

  // drag events
  item.addEventListener('dragstart', e => {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', JSON.stringify({ di, ei }));
    setTimeout(() => item.classList.add('dragging'), 0);
  });
  item.addEventListener('dragend', () => {
    item.classList.remove('dragging');
    document.querySelectorAll('.tl-item').forEach(el => el.classList.remove('drag-over'));
  });
  item.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.tl-item').forEach(el => el.classList.remove('drag-over'));
    item.classList.add('drag-over');
  });
  item.addEventListener('drop', e => {
    e.preventDefault();
    item.classList.remove('drag-over');
    try {
      const { di: fromDi, ei: fromEi } = JSON.parse(e.dataTransfer.getData('text/plain'));
      const toDi = di, toEi = ei;
      if (fromDi === toDi && fromEi !== toEi) {
        const events = defaultDays[fromDi].events;
        const [moved] = events.splice(fromEi, 1);
        const insertAt = fromEi < toEi ? toEi - 1 : toEi;
        events.splice(insertAt, 0, moved);
        renderItinerary();
      }
    } catch(err) {}
  });

  tl.appendChild(item);
}

function saveEvent(di, ei, item) {
  defaultDays[di].events[ei].time = item.querySelector('.tl-time').innerText.trim();
  defaultDays[di].events[ei].title = item.querySelector('.tl-title').innerText.trim();
  defaultDays[di].events[ei].desc = item.querySelector('.tl-desc').innerText.trim();
  scheduleSave();
}

function addEvent(di) {
  const ev = { time:'00:00', title:'新活动', desc:'点击编辑描述', tags:[] };
  defaultDays[di].events.push(ev);
  const ei = defaultDays[di].events.length - 1;
  renderEvent(di, ei, ev);
  const tl = document.getElementById('tl-' + di);
  const newItem = tl.lastElementChild;
  newItem.querySelector('.tl-time').focus();
  const range = document.createRange();
  range.selectNodeContents(newItem.querySelector('.tl-time'));
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
}

function removeEvent(di, ei) {
  defaultDays[di].events.splice(ei, 1);
  renderItinerary();
}

function addDay() {
  defaultDays.push({ label:'新的一天 — 点击编辑', events:[
    { time:'9:00', title:'新活动', desc:'点击编辑描述', tags:[] }
  ]});
  renderItinerary();
  const secs = document.querySelectorAll('#itinerary-days [data-day-index]');
  const last = secs[secs.length - 1];
  const labelEl = last.querySelector('.section-label');
  labelEl.focus();
  const range = document.createRange();
  range.selectNodeContents(labelEl);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
  last.scrollIntoView({ behavior:'smooth', block:'start' });
  saveToLocal();
}

function removeDay(di) {
  if (defaultDays.length <= 1) return;
  defaultDays.splice(di, 1);
  renderItinerary();
  saveToLocal();
}


// ── Checklist ──
function addCheckGroup(gridId, store, isGear) {
  store.push({ icon: '📦', name: '新分类', items: [] });
  const gi = store.length - 1;
  const grid = document.getElementById(gridId);
  const div = buildCheckGroupEl(gridId, gi, store[gi], isGear);
  grid.appendChild(div);
  if (isGear) updateGearProgress();
  // focus the group name for immediate editing
  const nameEl = div.querySelector('.group-name-edit');
  if (nameEl) {
    nameEl.focus();
    const range = document.createRange();
    range.selectNodeContents(nameEl);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  }
}

function buildCheckGroupEl(gridId, gi, group, isGear) {
  const div = document.createElement('div');
  div.className = group.reserve ? 'check-group check-group-reserve' : 'check-group';
  div.id = `${gridId}-g${gi}`;
  div.innerHTML = `<div class="check-group-title">${group.icon} <span class="group-name-edit" contenteditable="true" spellcheck="false">${group.name}</span><span class="cnt" id="${gridId}-cnt-${gi}">0/${group.items.length}</span></div>`;
  div.querySelector('.group-name-edit').addEventListener('input', function() { group.name = this.innerText.trim(); scheduleSave(); });
  group.items.forEach((item, ii) => {
    div.appendChild(buildCheckItemEl(gridId, gi, ii, item, isGear));
  });
  // allow dropping onto group container to move to end of this group
  div.addEventListener('dragover', e => { e.preventDefault(); });
  div.addEventListener('drop', e => {
    // only handle if dropped on the group itself, not a child item
    if (e.target.closest('.check-item')) return;
    e.preventDefault();
    try {
      const { gridId: fromGrid, gi: fromGi, ii: fromIi } = JSON.parse(e.dataTransfer.getData('text/plain'));
      const store = isGear ? gearGroups : foodGroups;
      if (fromGrid === gridId && (fromGi !== gi || true)) {
        const [moved] = store[fromGi].items.splice(fromIi, 1);
        store[gi].items.push(moved);
        rebuildCheckGrid(gridId, store, isGear);
      }
    } catch(err) {}
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'add-item-btn';
  addBtn.textContent = '＋ 新增物品';
  addBtn.onclick = () => {
    const newItem = { l: '新物品', n: '', e: false };
    group.items.push(newItem);
    const ii = group.items.length - 1;
    const row = buildCheckItemEl(gridId, gi, ii, newItem, isGear);
    div.insertBefore(row, addBtn);
    const nameSpan = row.querySelector('.item-name');
    nameSpan.focus();
    const range = document.createRange();
    range.selectNodeContents(nameSpan);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    updateGroupCount(gridId, gi, group.items.length);
    if (isGear) updateGearProgress();
    saveToLocal();
  };
  div.appendChild(addBtn);
  updateGroupCount(gridId, gi, group.items.length);
  return div;
}

  nameEl.addEventListener('blur', () => { nameEl.style.outline = ''; nameEl.style.background = ''; });

  });
  row.addEventListener('dragover', e => {
    e.preventDefault();
    document.querySelectorAll('.check-item').forEach(el => el.classList.remove('ci-drag-over'));
    row.classList.add('ci-drag-over');
  });
  row.addEventListener('drop', e => {
    e.preventDefault();
    row.classList.remove('ci-drag-over');
    try {
      const { gridId: fromGrid, gi: fromGi, ii: fromIi } = JSON.parse(e.dataTransfer.getData('text/plain'));
      const store = isGear ? gearGroups : foodGroups;
      if (fromGrid === gridId) {
        const fromItems = store[fromGi].items;
        const toItems = store[gi].items;
        const [moved] = fromItems.splice(fromIi, 1);
        if (fromGi === gi) {
          const insertAt = fromIi < ii ? ii - 1 : ii;
          toItems.splice(insertAt, 0, moved);
        } else {
          // cross-group: insert at position ii in target group
          toItems.splice(ii, 0, moved);
        }
        rebuildCheckGrid(gridId, store, isGear);
      }
    } catch(err) {}
  });
  const cb = row.querySelector('input');
  cb.addEventListener('change', function() {
    row.querySelector('.check-label').classList.toggle('done', this.checked);
    updateGroupCount(gridId, gi, (isGear ? gearGroups : foodGroups)[gi].items.length);
    if (isGear) updateGearProgress();
    scheduleSave();
  });
  row.querySelector('.item-del').addEventListener('click', () => {
    const store = isGear ? gearGroups : foodGroups;
    const idx = store[gi].items.indexOf(item);
    if (idx > -1) store[gi].items.splice(idx, 1);
    row.remove();
    updateGroupCount(gridId, gi, store[gi].items.length);
    if (isGear) updateGearProgress();
    saveToLocal();
  });

  return row;
}

function rebuildCheckGrid(gridId, store, isGear) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  let i = 0;
  while (i < store.length) {
    const group = store[i];
    if (!group.reserve && i + 1 < store.length && store[i+1].reserve) {
      // pair: main + reserve side by side
      const pair = document.createElement('div');
      pair.className = 'check-pair';
      pair.appendChild(buildCheckGroupEl(gridId, i, group, isGear));
      pair.appendChild(buildCheckGroupEl(gridId, i+1, store[i+1], isGear));
      grid.appendChild(pair);
      i += 2;
    } else {
      grid.appendChild(buildCheckGroupEl(gridId, i, group, isGear));
      i++;
    }
  }
  if (isGear) updateGearProgress();
}

function updateGroupCount(gridId, gi, total) {
  let checked = 0;
  document.querySelectorAll(`[id^="${gridId}-${gi}-"]`).forEach(el => { if (el.checked) checked++; });
  const el = document.getElementById(`${gridId}-cnt-${gi}`);
  if (el) el.textContent = `${checked}/${total}`;
}

function updateGearProgress() {
  const all = document.querySelectorAll('#gear-grid input[type=checkbox]');
  const checked = document.querySelectorAll('#gear-grid input[type=checkbox]:checked');
  const pct = all.length ? Math.round(checked.length / all.length * 100) : 0;
  document.getElementById('gear-fill').style.width = pct + '%';
  document.getElementById('gear-pct').textContent = `${checked.length} / ${all.length} 项已完成`;
}

function resetGear() {
  document.querySelectorAll('#gear-grid input[type=checkbox]').forEach(cb => {
    cb.checked = false;
    cb.closest('.check-item').querySelector('.check-label').classList.remove('done');
  });
  updateGearProgress();
  gearGroups.forEach((g, gi) => updateGroupCount('gear-grid', gi, g.items.length));
}

function resetFood() {
  document.querySelectorAll('#food-grid input[type=checkbox]').forEach(cb => {
    cb.checked = false;
    cb.closest('.check-item').querySelector('.check-label').classList.remove('done');
  });
  foodGroups.forEach((g, gi) => updateGroupCount('food-grid', gi, g.items.length));
}

// ── Food Tab ──
function renderFoodTab() {
  renderFoodMealDays();
  renderFoodShopping();
}

function renderFoodMealDays() {
  const wrap = document.getElementById('food-days-wrap');
  wrap.innerHTML = '';
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:12px;';
  foodMealDays.forEach(day => grid.appendChild(buildMealDayCard(day)));
  wrap.appendChild(grid);
}

function buildMealDayCard(day) {
  const card = document.createElement('div');
  card.className = 'meal-day-card';

  const header = document.createElement('div');
  header.className = 'meal-day-header';
  const label = document.createElement('div');
  label.className = 'meal-day-label';
  label.contentEditable = 'true';
  label.spellcheck = false;
  label.innerText = day.label;
  label.addEventListener('input', () => { day.label = label.innerText.trim(); scheduleSave(); });
  label.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();label.blur();} });
  const delDayBtn = document.createElement('button');
  delDayBtn.className = 'del-btn';
  delDayBtn.textContent = '✕';
  delDayBtn.title = '删除这一天';
  delDayBtn.addEventListener('click', () => {
    const idx = foodMealDays.indexOf(day);
    if (idx > -1) foodMealDays.splice(idx, 1);
    card.remove();
    saveToLocal();
  });
  header.appendChild(label);
  header.appendChild(delDayBtn);
  card.appendChild(header);

  day.meals.forEach(m => card.appendChild(buildMealItemRow(day, m, card)));

  const addBtn = document.createElement('button');
  addBtn.className = 'add-meal-btn';
  addBtn.textContent = '＋ 新增餐食';
  addBtn.onclick = () => {
    const m = { t: '新餐次', d: '写吃什么' };
    day.meals.push(m);
    const row = buildMealItemRow(day, m, card);
    card.insertBefore(row, addBtn);
    const el = row.querySelector('.meal-item-time');
    el.focus();
    const r = document.createRange(); r.selectNodeContents(el);
    window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
    saveToLocal();
  };
  card.appendChild(addBtn);
  return card;
}

function buildMealItemRow(day, m, card) {
  const row = document.createElement('div');
  row.className = 'meal-item';
  const timeEl = document.createElement('div');
  timeEl.className = 'meal-item-time';
  timeEl.contentEditable = 'true';
  timeEl.spellcheck = false;
  timeEl.innerText = m.t;
  timeEl.addEventListener('input', () => { m.t = timeEl.innerText.trim(); scheduleSave(); });
  timeEl.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();timeEl.blur();} });

  const descEl = document.createElement('div');
  descEl.className = 'meal-item-desc';
  descEl.contentEditable = 'true';
  descEl.spellcheck = false;
  descEl.innerText = m.d;
  descEl.addEventListener('input', () => { m.d = descEl.innerText.trim(); scheduleSave(); });

  const delBtn = document.createElement('button');
  delBtn.className = 'row-del';
  delBtn.textContent = '✕';
  delBtn.addEventListener('click', () => {
    const idx = day.meals.indexOf(m);
    if (idx > -1) day.meals.splice(idx, 1);
    row.remove();
    saveToLocal();
  });
  row.appendChild(timeEl);
  row.appendChild(descEl);
  row.appendChild(delBtn);
  return row;
}

function addMealDay() {
  const day = { label: '新的一天', meals: [{ t: '早餐', d: '写吃什么' }] };
  foodMealDays.push(day);
  const wrap = document.getElementById('food-days-wrap');
  const grid = wrap.querySelector('div') || wrap;
  const card = buildMealDayCard(day);
  grid.appendChild(card);
  card.querySelector('.meal-day-label').focus();
  saveToLocal();
}

// ── Food Shopping ──
function renderFoodShopping() {
  const grid = document.getElementById('food-grid');
  grid.innerHTML = '';
  const inner = document.createElement('div');
  inner.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:12px;';
  foodShoppingGroups.forEach(group => inner.appendChild(buildFoodGroupCard(group)));
  grid.appendChild(inner);
}

function buildFoodGroupCard(group) {
  const card = document.createElement('div');
  card.className = 'food-group-card';

  const header = document.createElement('div');
  header.className = 'food-group-header';
  const icon = document.createElement('span');
  icon.textContent = group.icon;
  const name = document.createElement('div');
  name.className = 'food-group-name';
  name.contentEditable = 'true';
  name.spellcheck = false;
  name.innerText = group.name;
  name.addEventListener('input', () => { group.name = name.innerText.trim(); scheduleSave(); });
  name.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();name.blur();} });

  const clearBtn = document.createElement('button');
  clearBtn.className = 'clear-btn';
  clearBtn.textContent = '↺ 清零';
  clearBtn.addEventListener('click', () => {
    card.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.checked = false;
      cb.closest('.food-item-row')?.querySelector('.food-item-name')?.classList.remove('done');
    });
    scheduleSave();
  });

  const delGroupBtn = document.createElement('button');
  delGroupBtn.className = 'del-btn';
  delGroupBtn.textContent = '✕';
  delGroupBtn.title = '删除分类';
  delGroupBtn.addEventListener('click', () => {
    const idx = foodShoppingGroups.indexOf(group);
    if (idx > -1) foodShoppingGroups.splice(idx, 1);
    card.remove();
    saveToLocal();
  });

  header.appendChild(icon);
  header.appendChild(name);
  header.appendChild(clearBtn);
  header.appendChild(delGroupBtn);
  card.appendChild(header);

  group.items.forEach(item => card.appendChild(buildFoodItemRow(group, item, card)));

  const addBtn = document.createElement('button');
  addBtn.className = 'add-item-btn';
  addBtn.textContent = '＋ 新增物品';
  addBtn.onclick = () => {
    const item = '新物品';
    group.items.push(item);
    const row = buildFoodItemRow(group, item, card);
    card.insertBefore(row, addBtn);
    const el = row.querySelector('.food-item-name');
    el.focus();
    const r = document.createRange(); r.selectNodeContents(el);
    window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
    saveToLocal();
  };
  card.appendChild(addBtn);
  return card;
}

function buildFoodItemRow(group, item, card) {
  const row = document.createElement('div');
  row.className = 'food-item-row';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  const nameEl = document.createElement('div');
  nameEl.className = 'food-item-name';
  nameEl.contentEditable = 'true';
  nameEl.spellcheck = false;
  nameEl.innerText = item;
  nameEl.addEventListener('input', () => {
    const idx = group.items.indexOf(item);
    if (idx > -1) group.items[idx] = nameEl.innerText.trim();
    scheduleSave();
  });
  nameEl.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();nameEl.blur();} });
  cb.addEventListener('change', function() {
    nameEl.classList.toggle('done', this.checked);
    scheduleSave();
  });
  const delBtn = document.createElement('button');
  delBtn.className = 'item-del';
  delBtn.textContent = '✕';
  delBtn.addEventListener('click', () => {
    const idx = group.items.indexOf(item);
    if (idx > -1) group.items.splice(idx, 1);
    row.remove();
    saveToLocal();
  });
  row.appendChild(cb);
  row.appendChild(nameEl);
  row.appendChild(delBtn);
  return row;
}

function addFoodGroup() {
  const group = { icon: '🛒', name: '新分类', items: [] };
  foodShoppingGroups.push(group);
  const outer = document.getElementById('food-grid');
  const inner = outer.querySelector('div') || outer;
  const card = buildFoodGroupCard(group);
  inner.appendChild(card);
  card.querySelector('.food-group-name').focus();
  saveToLocal();
}

function renderMeals() { renderFoodTab(); }

// ── Tips ──
function renderTips() {
  const wrap = document.getElementById('tips-container');
  wrap.innerHTML = '';
  defaultTips.forEach((tip, ti) => wrap.appendChild(buildTipEl(ti, tip)));
}

function buildTipEl(ti, tip) {
  const card = document.createElement('div');
  card.className = 'tip-card';
  card.innerHTML = `<div class="tip-content">
    <div class="tip-title" contenteditable="true" spellcheck="false">${tip.title}</div>
    <div class="tip-body" contenteditable="true" spellcheck="false">${tip.body}</div>
  </div>
  <button class="del-btn" style="font-size:14px" title="删除">✕</button>`;
  const titleEl = card.querySelector('.tip-title');
  const bodyEl = card.querySelector('.tip-body');
  titleEl.addEventListener('input', () => { tip.title = titleEl.innerText.trim(); scheduleSave(); });
  bodyEl.addEventListener('input', () => { tip.body = bodyEl.innerText.trim(); scheduleSave(); });
  card.querySelector('.del-btn').addEventListener('click', () => {
    const idx = defaultTips.indexOf(tip);
    if (idx > -1) defaultTips.splice(idx, 1);
    card.remove();
    saveToLocal();
  });
  return card;
}

function addTip() {
  defaultTips.push({ title:'新注意事项', body:'点击编辑内容' });
  const ti = defaultTips.length - 1;
  const wrap = document.getElementById('tips-container');
  const el = buildTipEl(ti, defaultTips[ti]);
  wrap.insertBefore(el, document.querySelector('.add-tip-btn'));
  el.querySelector('.tip-title').focus();
  const range = document.createRange();
  range.selectNodeContents(el.querySelector('.tip-title'));
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
}

function removeTip(ti) {
  defaultTips.splice(ti, 1);
  renderTips();
  saveToLocal();
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ── Export / Import ──
function exportData() {
  const data = {
    days: defaultDays,
    gearGroups,
    foodMealDays,
    foodShoppingGroups,
    tips: defaultTips,
    checks: {},
    exportedAt: new Date().toISOString(),
  };
  document.querySelectorAll('input[type=checkbox]').forEach(cb => {
    if (cb.id) data.checks[cb.id] = cb.checked;
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const date = new Date().toISOString().slice(0,10);
  a.download = `camping-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.days) defaultDays.splice(0, defaultDays.length, ...data.days);
      if (data.gearGroups) gearGroups.splice(0, gearGroups.length, ...data.gearGroups);
      // Support both new and old format
      if (data.foodMealDays) foodMealDays = data.foodMealDays;
      else if (data.mealDays) foodMealDays = data.mealDays;
      if (data.foodShoppingGroups) foodShoppingGroups = data.foodShoppingGroups;
      else if (data.foodGroups) foodShoppingGroups = data.foodGroups.map(g => ({
        icon: g.icon || '🛒',
        name: g.name,
        items: (g.items || []).map(item => typeof item === 'string' ? item : item.l || '')
      }));
      if (data.tips) defaultTips.splice(0, defaultTips.length, ...data.tips);
      renderItinerary();
      rebuildCheckGrid('gear-grid', gearGroups, true);
      renderFoodTab();

      renderTips();
      if (data.notes) {
        Object.assign(notes, data.notes);
        ['itinerary','gear','food','tips'].forEach(k => {
          const el = document.getElementById('note-' + k);
          if (el && data.notes[k]) el.innerText = data.notes[k];
        });
      }
      if (data.checks) {
        Object.entries(data.checks).forEach(([id, checked]) => {
          const cb = document.getElementById(id);
          if (cb) { cb.checked = checked; cb.closest('.check-item')?.querySelector('.check-label')?.classList.toggle('done', checked); }
        });
      }
      updateGearProgress();
      await saveToFirebase();
      alert('✅ 导入成功！数据已同步到云端。');
    } catch(err) { alert('导入失败，请确认文件格式正确。'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── Firebase Realtime Sync ──
const FIREBASE_URL = 'https://camping-planner-c7c57-default-rtdb.firebaseio.com/data.json';
let saveTimer = null;
let isSyncing = false;

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToFirebase, 1000);
}

async function saveToFirebase() {
  const titleEl = document.getElementById('trip-title');
  const data = {
    days: defaultDays,
    gearGroups,
    foodMealDays,
    foodShoppingGroups,
    tips: defaultTips,
    checks: {},
    tripTitle: titleEl ? titleEl.innerText : '',
    notes,
  };
  document.querySelectorAll('input[type=checkbox]').forEach(cb => {
    if (cb.id) data.checks[cb.id] = cb.checked;
  });
  try {
    await fetch(FIREBASE_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    showSaveIndicator('✓ 已同步');
  } catch(e) {
    showSaveIndicator('⚠️ 同步失败');
  }
}

function saveToLocal() { saveToFirebase(); }

async function loadFromFirebase() {
  try {
    const res = await fetch(FIREBASE_URL);
    if (!res.ok) return false;
    const data = await res.json();
    if (!data) return false;
    if (data.days) defaultDays.splice(0, defaultDays.length, ...data.days);
    if (data.gearGroups) gearGroups.splice(0, gearGroups.length, ...data.gearGroups);
    if (data.foodMealDays) foodMealDays = data.foodMealDays;
    if (data.foodShoppingGroups) foodShoppingGroups = data.foodShoppingGroups;
    if (data.tips) defaultTips.splice(0, defaultTips.length, ...data.tips);
    if (data.tripTitle) {
      const titleEl = document.getElementById('trip-title');
      if (titleEl) titleEl.innerText = data.tripTitle;
    }
    if (data.notes) {
      Object.assign(notes, data.notes);
      ['itinerary','gear','food','tips'].forEach(k => {
        const el = document.getElementById('note-' + k);
        if (el && data.notes[k]) el.innerText = data.notes[k];
      });
    }
    return data.checks || {};
  } catch(e) { return false; }
}

function loadFromLocal() { return false; }

function showSaveIndicator(msg) {
  let el = document.getElementById('save-indicator');
  if (!el) {
    el = document.createElement('div');
    el.id = 'save-indicator';
    el.style.cssText = 'font-size:11px;color:#1D9E75;margin-top:4px;height:16px;';
    document.querySelector('.header').appendChild(el);
  }
  el.textContent = msg || '✓ 已自动保存';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.textContent = ''; }, 2000);
}

// Hook scheduleSave into all data-modifying functions
const _origSaveEvent = typeof saveEvent !== 'undefined' ? saveEvent : null;

// ── Init ──
async function init() {
  showSaveIndicator('⏳ 加载中...');
  const savedChecks = await loadFromFirebase();
  renderItinerary();
  rebuildCheckGrid('gear-grid', gearGroups, true);
  renderFoodTab();
  renderTips();
  if (savedChecks) {
    Object.entries(savedChecks).forEach(([id, checked]) => {
      const cb = document.getElementById(id);
      if (cb) {
        cb.checked = checked;
        if (checked) cb.closest('.check-item')?.querySelector('.check-label')?.classList.add('done');
      }
    });
    updateGearProgress();
    gearGroups.forEach((_,gi) => updateGroupCount('gear-grid', gi, gearGroups[gi].items.length));
  }
  showSaveIndicator('✓ 已加载');
  document.addEventListener('input', scheduleSave);
  document.addEventListener('change', scheduleSave);
}
init();
