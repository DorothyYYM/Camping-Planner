<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>露营计划表</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f0;color:#1a1a1a;padding:20px 16px}
.container{max-width:900px;margin:0 auto}
.header{margin-bottom:24px}
.header h1{font-size:24px;font-weight:600}
.header-meta{font-size:13px;color:#666;margin-top:5px}
.edit-hint{font-size:12px;color:#aaa;margin-top:3px}
[contenteditable]:hover{background:#fffbe6;border-radius:3px}
[contenteditable]:focus{outline:2px solid #1D9E75;border-radius:3px;background:#fffbe6}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 16px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:transparent;color:#666;cursor:pointer;transition:all .15s}
.tab.active{background:#fff;color:#1a1a1a;border-color:#aaa;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab:hover:not(.active){background:#f0f0ec}
.panel{display:none}.panel.active{display:block}
.section-label{font-size:11px;font-weight:600;color:#888;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;margin-top:20px}
.backup-btns{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:1000}
.btn-export{padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#888;font-size:12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn-export:hover{background:#f0f0ec;color:#555}
.btn-import{padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#888;font-size:12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn-import:hover{background:#f0f0ec;color:#555}
/* Timeline */
.timeline{display:flex;flex-direction:column;gap:8px}
.tl-item{display:grid;grid-template-columns:20px 76px 1fr 32px;gap:10px;align-items:start}
.drag-handle{color:#ccc;font-size:16px;cursor:grab;user-select:none;padding-top:3px;text-align:center}
.drag-handle:hover{color:#888}
.tl-item.dragging{opacity:.4}
.tl-item.drag-over{border-top:2px solid #1D9E75}
.tl-time{font-size:12px;font-weight:600;color:#185FA5;background:#e6f1fb;border-radius:6px;padding:3px 8px;text-align:center;margin-top:3px;white-space:nowrap}
.tl-card{background:#fff;border:1px solid #e8e8e4;border-radius:8px;padding:10px 14px}
.tl-title{font-size:14px;font-weight:600}
.tl-desc{font-size:13px;color:#555;margin-top:4px;line-height:1.5}
.del-btn{background:transparent;border:none;color:#ddd;font-size:18px;cursor:pointer;padding:2px 4px;line-height:1;border-radius:4px;align-self:start}
.del-btn:hover{color:#e24b4a;background:#fef2f2}
.add-event-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1.5px dashed #c8e6c9;border-radius:8px;background:transparent;color:#2e7d32;font-size:13px;cursor:pointer;width:100%;margin-top:6px}
.add-event-btn:hover{background:#f1f8f1}
.add-section-btn{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1.5px dashed #ddd;border-radius:8px;background:transparent;color:#888;font-size:12px;cursor:pointer;margin-top:12px}
.add-section-btn:hover{background:#f5f5f0}
/* Gear */
.progress-wrap{background:#f0f0ec;border-radius:8px;padding:12px 16px;margin-bottom:16px}
.progress-header{display:flex;justify-content:space-between}
.progress-bar{height:6px;background:#ddd;border-radius:3px;margin:8px 0 0;overflow:hidden}
.progress-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width .3s}
.gear-grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-group{background:#fff;border:1px solid #e8e8e4;border-radius:12px;padding:14px 16px}
.check-group-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.cnt{margin-left:auto;font-size:11px;color:#aaa;font-weight:400}
.reset-category-btn{font-size:11px;padding:2px 8px;border:1px solid #ddd;border-radius:6px;background:transparent;color:#888;cursor:pointer}
.reset-category-btn:hover{background:#f5f5f0}
.check-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0ec}
.check-item:last-of-type{border-bottom:none}
.check-item input[type=checkbox]{margin-top:3px;accent-color:#1D9E75;flex-shrink:0;width:14px;height:14px;cursor:pointer}
.check-drag{color:#ccc;font-size:13px;cursor:grab;user-select:none;flex-shrink:0;margin-top:2px}
.check-drag:hover{color:#888}
.check-item.ci-dragging{opacity:.3}
.check-item.ci-drag-over{border-top:2px solid #1D9E75}
.check-label-wrap{flex:1;min-width:0}
.check-label{font-size:13px;color:#1a1a1a;line-height:1.4}
.check-label.done{text-decoration:line-through;color:#bbb}
.item-note{font-size:11px;color:#999;min-height:1em}
.item-note:empty:before{content:attr(data-placeholder);color:#ccc;pointer-events:none}
.item-name,.item-note{outline:none}
.item-name:focus,.item-note:focus{outline:1px solid #1D9E75;border-radius:3px;background:#fffbe6}
.item-del{background:transparent;border:none;color:#ddd;font-size:15px;cursor:pointer;padding:0 2px;flex-shrink:0}
.item-del:hover{color:#e24b4a}
.add-item-btn{display:flex;align-items:center;gap:6px;padding:5px 0;color:#aaa;font-size:12px;background:transparent;border:none;cursor:pointer;width:100%;margin-top:4px}
.add-item-btn:hover{color:#1D9E75}
.reserve-divider{font-size:11px;font-weight:600;color:#bbb;letter-spacing:.06em;text-transform:uppercase;padding:8px 0 4px;border-top:1px dashed #eee;margin-top:6px}
.reserve-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0ec}
.reserve-item:last-of-type{border-bottom:none}
.btn-add-to-main{background:transparent;border:none;color:#1D9E75;font-size:15px;cursor:pointer;padding:0 2px;flex-shrink:0;line-height:1}
.btn-add-to-main:hover{color:#0d7a5a}
.btn-move-to-reserve{background:transparent;border:none;color:#ddd;font-size:15px;cursor:pointer;padding:0 2px;flex-shrink:0;line-height:1}
.btn-move-to-reserve:hover{color:#e24b4a}
.add-group-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1.5px dashed #ddd;border-radius:10px;background:transparent;color:#888;font-size:13px;cursor:pointer;width:100%;margin-top:4px}
.add-group-btn:hover{background:#f5f5f0}
.reset-btn{margin-top:14px;padding:7px 16px;border:1px solid #ddd;border-radius:8px;background:transparent;color:#888;font-size:13px;cursor:pointer}
.reset-btn:hover{background:#f0f0ec}
/* Food */
.meal-day-card{background:#fff;border:1px solid #e8e8e4;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.meal-day-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.meal-day-label{font-size:13px;font-weight:600;flex:1}
.meal-item{display:grid;grid-template-columns:90px 1fr 24px;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0ec;align-items:start}
.meal-item:last-of-type{border-bottom:none}
.meal-item-time{font-size:12px;font-weight:600;color:#888}
.meal-item-desc{font-size:13px;color:#1a1a1a;line-height:1.4}
.row-del{background:transparent;border:none;color:#ddd;font-size:15px;cursor:pointer;padding:0;line-height:1}
.row-del:hover{color:#e24b4a}
.add-meal-btn{display:flex;align-items:center;gap:6px;padding:6px 0;color:#aaa;font-size:12px;background:transparent;border:none;cursor:pointer;width:100%;margin-top:6px}
.add-meal-btn:hover{color:#1D9E75}
.food-group-card{background:#fff;border:1px solid #e8e8e4;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.food-group-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.food-group-name{font-size:13px;font-weight:600;flex:1}
.food-item-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0ec}
.food-item-row:last-of-type{border-bottom:none}
.food-item-row input[type=checkbox]{accent-color:#1D9E75;flex-shrink:0;width:14px;height:14px;cursor:pointer}
.food-item-name{font-size:13px;flex:1;color:#1a1a1a}
.food-item-name.done{text-decoration:line-through;color:#bbb}
.clear-btn{font-size:11px;padding:3px 10px;border:1px solid #ddd;border-radius:6px;background:transparent;color:#888;cursor:pointer;white-space:nowrap}
.clear-btn:hover{background:#f5f5f0}
.food-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Tips */
.tip-card{border-left:3px solid #5DCAA5;background:#fff;border-right:1px solid #e8e8e4;border-top:1px solid #e8e8e4;border-bottom:1px solid #e8e8e4;padding:10px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr 28px;gap:8px;align-items:start}
.tip-title{font-size:13px;font-weight:600}
.tip-body{font-size:12px;color:#666;margin-top:3px;line-height:1.5}
.add-tip-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1.5px dashed #ddd;border-radius:8px;background:transparent;color:#888;font-size:13px;cursor:pointer;width:100%;margin-top:4px}
.add-tip-btn:hover{background:#f5f5f0}
/* Note */
.note-box{margin-top:20px;width:100%;min-height:80px;padding:12px 14px;border:1px solid #e8e8e4;border-radius:10px;background:#fff;font-size:13px;color:#555;line-height:1.6;font-family:inherit;outline:none}
.note-box:focus{border-color:#1D9E75}
.note-box:empty:before{content:attr(data-placeholder);color:#ccc;pointer-events:none}
.note-label{font-size:11px;font-weight:600;color:#aaa;letter-spacing:.06em;text-transform:uppercase;margin-top:20px;margin-bottom:6px}
.budget-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.summary-card{background:#fff;border:1px solid #e8e8e4;border-radius:10px;padding:12px 16px;text-align:center}
.summary-card .val{font-size:22px;font-weight:600;color:#1a1a1a;margin-top:4px}
.summary-card .lbl{font-size:12px;color:#888}
.expense-row{display:grid;grid-template-columns:1fr 90px 90px 100px 32px;gap:8px;align-items:center;padding:8px 12px;background:#fff;border:1px solid #e8e8e4;border-radius:8px;margin-bottom:6px}
.expense-row input,.expense-row select{border:1px solid #e8e8e4;border-radius:6px;padding:5px 8px;font-size:13px;background:#fff;width:100%;font-family:inherit}
.expense-row input:focus,.expense-row select:focus{outline:1px solid #1D9E75;border-color:#1D9E75}
.settle-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e8e8e4}
.settle-table th{background:#f5f5f0;padding:8px 12px;text-align:left;font-weight:500;font-size:12px;color:#888}
.settle-table td{padding:8px 12px;border-top:1px solid #f0f0ec}
.badge-owe{background:#fcebeb;color:#a32d2d;padding:2px 8px;border-radius:20px;font-size:11px}
.badge-recv{background:#e1f5ee;color:#0f6e56;padding:2px 8px;border-radius:20px;font-size:11px}
.badge-ok{background:#f0f0ec;color:#888;padding:2px 8px;border-radius:20px;font-size:11px}
.people-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.person-tag{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #e8e8e4;border-radius:20px;padding:4px 10px;font-size:13px}
.person-tag input{border:none;outline:none;font-size:13px;width:60px;background:transparent}
.person-tag .rm{background:transparent;border:none;color:#ccc;cursor:pointer;font-size:13px;padding:0 2px}
.person-tag .rm:hover{color:#e24b4a}
.add-person-btn{padding:4px 12px;border:1.5px dashed #ddd;border-radius:20px;background:transparent;color:#888;font-size:13px;cursor:pointer}
.add-person-btn:hover{background:#f5f5f0}
.link-card{display:grid;grid-template-columns:1fr 1fr 32px;gap:10px;align-items:center;background:#fff;border:1px solid #e8e8e4;border-radius:10px;padding:12px 16px;margin-bottom:8px}
.link-card input{border:1px solid #e8e8e4;border-radius:6px;padding:6px 10px;font-size:13px;width:100%;font-family:inherit;outline:none}
.link-card input:focus{border-color:#1D9E75}
.link-card input.link-url{color:#185FA5}
.link-open-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#185FA5;background:transparent;border:1px solid #b3d8ef;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap;text-decoration:none}
.link-open-btn:hover{background:#e6f1fb}
.link-card-inner{display:flex;flex-direction:column;gap:6px}
.confirm-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:999;display:flex;align-items:center;justify-content:center}
.confirm-box{background:#fff;border-radius:12px;padding:24px;max-width:320px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.confirm-box p{font-size:14px;color:#1a1a1a;line-height:1.5;margin-bottom:16px}
.confirm-actions{display:flex;gap:8px;justify-content:flex-end}
.confirm-cancel{padding:7px 16px;border:1px solid #ddd;border-radius:8px;background:transparent;color:#666;font-size:13px;cursor:pointer}
.confirm-ok{padding:7px 16px;border:none;border-radius:8px;background:#e24b4a;color:#fff;font-size:13px;cursor:pointer;font-weight:500}
@media(max-width:540px){.gear-grid-2col,.food-2col{grid-template-columns:1fr}.tl-item{grid-template-columns:16px 64px 1fr 28px}}
</style>
</head>
<body>
<div class="backup-btns">
  <button class="btn-export" onclick="event.stopPropagation();exportData()">⬇ 导出</button>
  <button class="btn-import" onclick="event.stopPropagation();document.getElementById('import-input').click()">⬆ 导入</button>
</div>
<div class="container">
  <div class="header">
    <h1 id="trip-title" contenteditable="true" spellcheck="false" oninput="scheduleSave()">🏕️ La Mauricie 露营计划</h1>
    <div class="header-meta" contenteditable="true" spellcheck="false" oninput="scheduleSave()">Rivière-à-la-Pêche · 6月27–28日 · 4大人 2小孩</div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('itinerary',this)">📅 行程</button>
    <button class="tab" onclick="switchTab('gear',this)">🎒 装备清单</button>
    <button class="tab" onclick="switchTab('food',this)">🍳 食物计划</button>
    <button class="tab" onclick="switchTab('tips',this)">🔗 相关链接</button>
    <button class="tab" onclick="switchTab('budget',this)">💰 记账</button>
  </div>
  <div id="tab-budget" class="panel">
    <div id="budget-people-wrap"></div>
    <div id="budget-summary"></div>
    <div class="section-label" style="margin-top:20px">账单明细</div>
    <div id="budget-list"></div>
    <button class="add-section-btn" onclick="addExpense()" style="margin-top:8px">＋ 新增支出</button>
    <div class="section-label" style="margin-top:24px">结算明细</div>
    <div id="budget-settle"></div>
    <div class="note-label">备注</div>
    <div class="note-box" contenteditable="true" spellcheck="false" data-placeholder="记账备注…" oninput="notes.budget=this.innerText;scheduleSave()"></div>
  </div>

  <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
  <div id="tab-itinerary" class="panel active">
    <div id="itinerary-days"></div>
    <button class="add-section-btn" onclick="addDay()">＋ 新增一天</button>
    <div class="note-label">备注</div>
    <div class="note-box" contenteditable="true" spellcheck="false" data-placeholder="行程备注…" oninput="notes.itinerary=this.innerText;scheduleSave()"></div>
  </div>
  <div id="tab-gear" class="panel">
    <div class="progress-wrap">
      <div class="progress-header"><span style="font-size:13px;font-weight:600">准备进度</span><span id="gear-pct" style="font-size:13px;color:#666">0 / 0 项已完成</span></div>
      <div class="progress-bar"><div class="progress-fill" id="gear-fill" style="width:0%"></div></div>
    </div>
    <div class="gear-grid-2col" id="gear-grid"></div>
    <button class="add-group-btn" onclick="addGearGroup()" style="margin-top:12px">＋ 新增分类</button>
    <br><button class="reset-btn" onclick="resetGear()">↺ 重置所有勾选</button>
    <div class="note-label">备注</div>
    <div class="note-box" contenteditable="true" spellcheck="false" data-placeholder="装备备注…" oninput="notes.gear=this.innerText;scheduleSave()"></div>
  </div>
  <div id="tab-food" class="panel">
    <div id="food-days-wrap"></div>
    <button class="add-section-btn" onclick="addMealDay()" style="margin-top:8px">＋ 新增一天</button>
    <div class="section-label" style="margin-top:24px">购物清单</div>
    <div id="food-grid"></div>
    <button class="add-group-btn" onclick="addFoodGroup()" style="margin-top:12px">＋ 新增分类</button>
    <div class="note-label">备注</div>
    <div class="note-box" contenteditable="true" spellcheck="false" data-placeholder="食物备注…" oninput="notes.food=this.innerText;scheduleSave()"></div>
  </div>
  <div id="tab-tips" class="panel">
    <div id="links-container"></div>
    <button class="add-tip-btn" onclick="addLink()" style="margin-top:8px">＋ 新增链接</button>
    <div class="note-label">备注</div>
    <div class="note-box" contenteditable="true" spellcheck="false" data-placeholder="备注…" oninput="notes.tips=this.innerText;scheduleSave()"></div>
  </div>
</div>
<script>

const notes = { itinerary:'', gear:'', food:'', tips:'', budget:'' };
let budgetPeople = ['大人1','大人2','大人3','大人4'];
let budgetExpenses = [];
const EXPENSE_CATS = ['交通','营地','餐饮','活动','装备','其他'];

const FIREBASE_URL = 'https://camping-planner-c7c57-default-rtdb.firebaseio.com/data.json';
let saveTimer = null;

const defaultDays = [
  {
    "label": "周六 6月27日 — 出发 + 徒步",
    "events": [
      {
        "time": "9:00",
        "title": "出发",
        "desc": "出发前加满油，备好路上零食和饮水。",
        "tags": [
          "drive"
        ]
      },
      {
        "time": "途中",

        "tags": [

        ]
      },
      {
        "time": "12:00",

        "desc": "车程约2.5小时，预计12:00到达。直接导航到公园入口： **Parc national de la Mauricie, entrée Saint-Jean-des-Piles** 地址：Chemin de Saint-Jean-des-Piles, Shawinigan, QC G0X 2V0",
        "tags": [
          "drive"
        ]
      },
      {
        "time": "12:15",
        "title": "徒步：Lac-Solitaire Trail（6.1km）",

        "tags": [

      },
      {

        "title": "前往营地 — Location D, Site R-D5",
        "desc": "徒步结束后前往预订营位：Location D，Site Number R-D5。卸车、搭帐篷，安顿行李。营地土质为砾石，需锤子或石块钉营钉。",
        "tags": [

      },
      {

        ]

  },
  {
    "label": "周日 6月28日 — 收营 + 划船 + 返程",
    "events": [
      {
        "time": "8:00–10:00",
        "title": "自由活动 & Brunch",
        "desc": "上午自由活动，各自解决 Brunch。享受营地最后的早晨，可以散步、玩耍或放松。",
        "tags": [
          "camp"
        ]
      },
      {
        "time": "10:00",
        "title": "收拾营地",
        "desc": "打包帐篷和所有装备，清理营位，垃圾带走，恢复原状。",
        "tags": [
          "camp"
        ]
      },
      {
        "time": "11:00",
        "title": "Check out — Location D, Site R-D5",
        "desc": "办理退营手续，确认营位清理干净后直接前往 Lac-Édouard。",
        "tags": [
          "camp"
        ]

function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveToFirebase, 1000); }

async function saveToFirebase() {
  const titleEl = document.getElementById('trip-title');
  const checks = {};
  document.querySelectorAll('input[type=checkbox]').forEach(cb => { if(cb.id) checks[cb.id]=cb.checked; });
  // Deep copy to avoid reference issues
  const payload = {
    days: JSON.parse(JSON.stringify(defaultDays)),
    gearGroups: JSON.parse(JSON.stringify(gearGroups)),
    foodMealDays: JSON.parse(JSON.stringify(foodMealDays)),
    foodShoppingGroups: JSON.parse(JSON.stringify(foodShoppingGroups)),
    tips: JSON.parse(JSON.stringify(defaultLinks)),
    checks,
    notes: JSON.parse(JSON.stringify(notes)),
    budgetPeople: JSON.parse(JSON.stringify(budgetPeople)),
    budgetExpenses: JSON.parse(JSON.stringify(budgetExpenses)),
    tripTitle: titleEl ? titleEl.innerText : ''
  };
  console.log('Saving gearGroups count:', payload.gearGroups.length);
  try {
    await fetch(FIREBASE_URL, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    showSaved('✓ 已同步');
  } catch(e) { showSaved('⚠️ 同步失败'); }
}

function saveToLocal() { saveToFirebase(); }

async function loadFromFirebase() {
  try {
    const res = await fetch(FIREBASE_URL);
    if (!res.ok) return false;
    const data = await res.json();
    if (!data) return false;
    if (data.days) defaultDays.splice(0,defaultDays.length,...data.days);
    if (data.gearGroups) {
      const cleaned = data.gearGroups.map(g => ({
        ...g,
        reserve: g.reserve === true || (typeof g.name === 'string' && g.name.includes('备选库')),
        items: (g.items || []).map(i => typeof i === 'string' ? {l:i,n:''} : i)
      }));
      gearGroups.splice(0,gearGroups.length,...cleaned);
    }
    if (data.foodMealDays) { foodMealDays = data.foodMealDays; }
    else if (data.mealDays) { foodMealDays = data.mealDays.map(d => ({ label:d.label, meals:d.meals.map(m=>({t:m.t,d:m.d||m.n||''})) })); }
    if (data.foodShoppingGroups) {
      foodShoppingGroups = data.foodShoppingGroups.map(g=>({
        ...g,
        items: (g.items||[]).map(i => typeof i==='string' ? i : (i && i.l ? i.l : String(i)))
      }));
    } else if (data.foodGroups) {
      foodShoppingGroups = data.foodGroups.map(g=>({ icon:g.icon||'🛒', name:g.name, items:(g.items||[]).map(i=>typeof i==='string'?i:i&&i.l?i.l:'') }));
    }
    if (data.tips) defaultLinks.splice(0,defaultLinks.length,...data.tips);
    if (data.notes) Object.assign(notes, data.notes);
    if (data.budgetPeople) { budgetPeople.splice(0,budgetPeople.length,...data.budgetPeople); }
    if (data.budgetExpenses) { budgetExpenses.splice(0,budgetExpenses.length,...data.budgetExpenses); }
    if (data.tripTitle) { const el=document.getElementById('trip-title'); if(el) el.innerText=data.tripTitle; }
    return data.checks || {};
  } catch(e) { return false; }
}

function showSaved(msg) {
  let el = document.getElementById('save-indicator');
  if (!el) { el=document.createElement('div'); el.id='save-indicator'; el.style.cssText='font-size:11px;color:#1D9E75;margin-top:4px;height:16px;'; document.querySelector('.header').appendChild(el); }
  el.textContent = msg; clearTimeout(el._t); el._t = setTimeout(()=>{ el.textContent=''; }, 2000);
}

function renderItinerary() {
  const wrap = document.getElementById('itinerary-days');
  wrap.innerHTML = '';
  defaultDays.forEach((day, di) => {
    const sec = document.createElement('div');
    const label = di===0?'0':'20px';
    sec.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-top:'+label+';margin-bottom:10px"><span class="section-label" style="margin:0;flex:1" contenteditable="true" spellcheck="false">'+day.label+'</span><button class="del-btn" style="font-size:14px">✕</button></div><div class="timeline" id="tl-'+di+'"></div><button class="add-event-btn">＋ 新增活动</button>';
    sec.querySelector('.section-label').addEventListener('input', function(){ defaultDays[di].label=this.innerText.trim(); scheduleSave(); });
    sec.querySelector('.del-btn').addEventListener('click', () => removeDay(di));
    sec.querySelector('.add-event-btn').addEventListener('click', () => addEvent(di));
    wrap.appendChild(sec);
    day.events.forEach((ev,ei) => renderEvent(di,ei,ev));
  });
}

function renderEvent(di, ei, ev) {
  const tl = document.getElementById('tl-'+di);
  const item = document.createElement('div');
  item.className = 'tl-item';
  item.draggable = true;
  item.innerHTML = '<span class="drag-handle">⠿</span><span class="tl-time" contenteditable="true" spellcheck="false">'+ev.time+'</span><div class="tl-card"><div class="tl-title" contenteditable="true" spellcheck="false">'+ev.title+'</div><div class="tl-desc" contenteditable="true" spellcheck="false">'+ev.desc+'</div></div><button class="del-btn" title="删除">✕</button>';
  item.querySelector('.tl-time').addEventListener('input', e => { defaultDays[di].events[ei].time=e.target.innerText.trim(); scheduleSave(); });
  item.querySelector('.tl-title').addEventListener('input', e => { defaultDays[di].events[ei].title=e.target.innerText.trim(); scheduleSave(); });
  item.querySelector('.tl-desc').addEventListener('input', e => { defaultDays[di].events[ei].desc=e.target.innerText.trim(); scheduleSave(); });
  item.querySelector('.del-btn').addEventListener('click', () => {
    const idx=defaultDays[di].events.indexOf(ev); if(idx>-1) defaultDays[di].events.splice(idx,1); item.remove(); saveToLocal();
  });
  item.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain',JSON.stringify({di,ei})); setTimeout(()=>item.classList.add('dragging'),0); });
  item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.tl-item').forEach(el=>el.classList.remove('drag-over')); });
  item.addEventListener('dragover', e => { e.preventDefault(); document.querySelectorAll('.tl-item').forEach(el=>el.classList.remove('drag-over')); item.classList.add('drag-over'); });
  item.addEventListener('drop', e => {
    e.preventDefault(); item.classList.remove('drag-over');
    try {
      const {di:fdi,ei:fei} = JSON.parse(e.dataTransfer.getData('text/plain'));
      if (fdi===di && fei!==ei) { const [m]=defaultDays[fdi].events.splice(fei,1); defaultDays[fdi].events.splice(fei<ei?ei-1:ei,0,m); renderItinerary(); saveToLocal(); }
    } catch(e) {}
  });
  tl.appendChild(item);
}

function addEvent(di) {
  const ev={time:'00:00',title:'新活动',desc:'点击编辑',tags:[]};
  defaultDays[di].events.push(ev);
  const ei=defaultDays[di].events.length-1;
  renderEvent(di,ei,ev);
  const tl=document.getElementById('tl-'+di);
  const t=tl.lastElementChild.querySelector('.tl-time');
  t.focus(); const r=document.createRange(); r.selectNodeContents(t); window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
  saveToLocal();
}

function removeDay(di) { if(defaultDays.length<=1) return; defaultDays.splice(di,1); renderItinerary(); saveToLocal(); }

function addDay() {
  defaultDays.push({label:'新的一天',events:[{time:'9:00',title:'新活动',desc:'点击编辑',tags:[]}]});
  renderItinerary();
  const secs=document.querySelectorAll('#itinerary-days>div');
  const last=secs[secs.length-1];
  const lbl=last.querySelector('.section-label');
  lbl.focus(); const r=document.createRange(); r.selectNodeContents(lbl); window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
  last.scrollIntoView({behavior:'smooth',block:'start'}); saveToLocal();
}

function renderGear() {
  const grid=document.getElementById('gear-grid');
  grid.innerHTML='';
  let i=0;
  while(i<gearGroups.length) {
    const g=gearGroups[i];
    if(!g.reserve) {
      const rg=(i+1<gearGroups.length&&gearGroups[i+1].reserve)?gearGroups[i+1]:null;
      grid.appendChild(buildGearCard(i,g,rg));
      i+=rg?2:1;
    } else { i++; }
  }
  updateGearProgress();
}

function buildGearCard(gi, group, reserveGroup) {
  const card=document.createElement('div'); card.className='check-group'; card.id='gear-g'+gi;
  const header=document.createElement('div'); header.className='check-group-title';
  header.appendChild(document.createTextNode(group.icon+' '));
  const ns=document.createElement('span'); ns.className='group-name-edit'; ns.contentEditable='true'; ns.spellcheck=false; ns.innerText=group.name;
  ns.addEventListener('input',()=>{group.name=ns.innerText.trim();scheduleSave();});
  const cnt=document.createElement('span'); cnt.className='cnt'; cnt.id='gear-cnt-'+gi; cnt.textContent='0/'+group.items.length;
  const rb=document.createElement('button'); rb.className='reset-category-btn'; rb.textContent='↺ 还原';
  rb.addEventListener('click',()=>{
    if(!reserveGroup) return;
    group.items.forEach(item=>reserveGroup.items.push(typeof item==='string'?{l:item,n:''}:item));
    group.items=[]; renderGear(); saveToLocal();
  });
  const delCatBtn=document.createElement('button'); delCatBtn.className='reset-category-btn'; delCatBtn.textContent='删除'; delCatBtn.title='删除此分类'; delCatBtn.style.color='#e24b4a'; delCatBtn.style.borderColor='#f0a0a0';
  delCatBtn.addEventListener('click',()=>{

      const idx=gearGroups.indexOf(group);
      if(idx>-1) gearGroups.splice(idx,1);
      if(reserveGroup){ const ri=gearGroups.indexOf(reserveGroup); if(ri>-1) gearGroups.splice(ri,1); }
      card.remove(); updateGearProgress(); saveToLocal();
    });
  });
  header.appendChild(ns); header.appendChild(cnt); header.appendChild(rb); header.appendChild(delCatBtn); card.appendChild(header);
  group.items.forEach(item=>card.appendChild(buildMainItem(gi,group,item,reserveGroup)));

  card.appendChild(ab);

function buildMainItem(gi, group, item, reserveGroup) {

  const drag=document.createElement('span'); drag.className='check-drag'; drag.textContent='⠿';

  cb.addEventListener('change',function(){ row.querySelector('.check-label').classList.toggle('done',this.checked); updateGroupCount(gi,group.items.length); updateGearProgress(); scheduleSave(); });
  const wrap=document.createElement('div'); wrap.className='check-label-wrap';
  const lbl=document.createElement('div'); lbl.className='check-label';
  const ne=document.createElement('span'); ne.className='item-name'; ne.contentEditable='true'; ne.spellcheck=false; ne.innerText=typeof item==='string'?item:item.l;
  ne.addEventListener('input',()=>{ if(typeof item==='object') item.l=ne.innerText.trim(); scheduleSave(); });
  ne.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();ne.blur();} });
  lbl.appendChild(ne);
  const note=document.createElement('div'); note.className='item-note'; note.contentEditable='true'; note.spellcheck=false; note.setAttribute('data-placeholder','添加备注…'); note.innerText=typeof item==='object'?(item.n||''):'';
  note.addEventListener('input',()=>{ if(typeof item==='object') item.n=note.innerText.trim(); scheduleSave(); });
  wrap.appendChild(lbl); wrap.appendChild(note);
  const mb=document.createElement('button'); mb.className='btn-move-to-reserve'; mb.textContent='➖'; mb.title='移到备选库';
  mb.addEventListener('click',()=>{
    if(!reserveGroup) return;
    const idx=group.items.indexOf(item); if(idx>-1) group.items.splice(idx,1);
    reserveGroup.items.push(typeof item==='string'?{l:item,n:''}:item);
    renderGear(); saveToLocal();
  });
  row.appendChild(drag); row.appendChild(cb); row.appendChild(wrap); row.appendChild(mb);
  row.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',JSON.stringify({gi,ii:group.items.indexOf(item)})); setTimeout(()=>row.classList.add('ci-dragging'),0); });
  row.addEventListener('dragend',()=>{ row.classList.remove('ci-dragging'); document.querySelectorAll('.check-item').forEach(el=>el.classList.remove('ci-drag-over')); });
  row.addEventListener('dragover',e=>{ e.preventDefault(); document.querySelectorAll('.check-item').forEach(el=>el.classList.remove('ci-drag-over')); row.classList.add('ci-drag-over'); });
  row.addEventListener('drop',e=>{
    e.preventDefault(); row.classList.remove('ci-drag-over');
    try { const {gi:fgi,ii:fii}=JSON.parse(e.dataTransfer.getData('text/plain')); if(fgi===gi){ const toIi=group.items.indexOf(item); const [m]=group.items.splice(fii,1); group.items.splice(fii<toIi?toIi-1:toIi,0,m); renderGear(); saveToLocal(); } } catch(e) {}
  });
  return row;
}

function importData(event) {
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try {
      const data=JSON.parse(e.target.result);
      if(data.days) defaultDays.splice(0,defaultDays.length,...data.days);
      if(data.gearGroups) {
        const cleaned = data.gearGroups.map(g => ({
          ...g,
          reserve: g.reserve === true || (typeof g.name === 'string' && g.name.includes('备选库')),
          items: (g.items || []).map(i => typeof i === 'string' ? {l:i,n:''} : i)
        }));
        gearGroups.splice(0,gearGroups.length,...cleaned);
      }
      if(data.foodMealDays) { foodMealDays=data.foodMealDays; }
      else if(data.mealDays) { foodMealDays=data.mealDays.map(d=>({label:d.label,meals:d.meals.map(m=>({t:m.t,d:m.d||m.n||''}))})); }
      if(data.foodShoppingGroups) {
        foodShoppingGroups=data.foodShoppingGroups.map(g=>({
          ...g,
          items:(g.items||[]).map(i=>typeof i==='string'?i:(i&&i.l?i.l:String(i)))
        }));
      } else if(data.foodGroups) {
        foodShoppingGroups=data.foodGroups.map(g=>({icon:g.icon||'🛒',name:g.name,items:(g.items||[]).map(i=>typeof i==='string'?i:i&&i.l?i.l:'')}));
      }
      if(data.tips) defaultLinks.splice(0,defaultLinks.length,...data.tips);
      if(data.notes) Object.assign(notes,data.notes);
      if(data.budgetPeople) { budgetPeople.splice(0,budgetPeople.length,...data.budgetPeople); }
      if(data.budgetExpenses) { budgetExpenses.splice(0,budgetExpenses.length,...data.budgetExpenses); }
      renderItinerary(); renderGear(); renderFoodTab(); renderTips();
      if(data.checks) Object.entries(data.checks).forEach(([id,checked])=>{const cb=document.getElementById(id);if(cb){cb.checked=checked;cb.closest('.check-item')?.querySelector('.check-label')?.classList.toggle('done',checked);}});
      updateGearProgress();
      await saveToFirebase();
      alert('✅ 导入成功！');
    } catch(err) { alert('导入失败'); }
  };
  reader.readAsText(file); event.target.value='';
}

  return row;
}

function addExpense() {
  const ex = {name:'', amount:0, payer:budgetPeople[0]||'', cat:'其他'};
  budgetExpenses.push(ex);
  const wrap = document.getElementById('budget-list');
  wrap.appendChild(buildExpenseRow(ex));
  wrap.lastElementChild.querySelector('input').focus();
  saveToLocal();
}

function renderBudgetSettle() {
  const wrap = document.getElementById('budget-settle');
  if (!wrap) return;
  if (budgetPeople.length === 0) { wrap.innerHTML='<p style="font-size:13px;color:#aaa;padding:12px 0">请先添加参与人员</p>'; return; }
  const total = budgetExpenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const perPerson = budgetPeople.length ? total/budgetPeople.length : 0;
  const paid = {};
  budgetPeople.forEach(p => paid[p]=0);
  budgetExpenses.forEach(ex => { if(paid[ex.payer]!==undefined) paid[ex.payer]+=(parseFloat(ex.amount)||0); });
  const table = document.createElement('table'); table.className='settle-table';
  table.innerHTML = '<thead><tr><th>姓名</th><th>垫付</th><th>应付（人均）</th><th>结算</th></tr></thead>';
  const tbody = document.createElement('tbody');
  budgetPeople.forEach(p => {
    const paidAmt = paid[p]||0;
    const diff = paidAmt - perPerson;
    const tr = document.createElement('tr');
    let badge;
    if (Math.abs(diff)<0.01) badge='<span class="badge-ok">已结清</span>';
    else if (diff>0) badge='<span class="badge-recv">应收回 $'+diff.toFixed(2)+'</span>';
    else badge='<span class="badge-owe">应补交 $'+Math.abs(diff).toFixed(2)+'</span>';
    tr.innerHTML = '<td>'+p+'</td><td>$'+paidAmt.toFixed(2)+'</td><td>$'+perPerson.toFixed(2)+'</td><td>'+badge+'</td>';
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = ''; wrap.appendChild(table);
}

function switchTab(name,btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='budget') renderBudget();
}

function showConfirm(msg, onOk) {
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-box"><p>'+msg+'</p><div class="confirm-actions"><button class="confirm-cancel">取消</button><button class="confirm-ok">确认删除</button></div></div>';
  overlay.querySelector('.confirm-cancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('.confirm-ok').addEventListener('click', () => { overlay.remove(); onOk(); });
  document.body.appendChild(overlay);
}

async function init() {
  showSaved('⏳ 加载中…');
  const savedChecks = await loadFromFirebase();
  renderItinerary(); renderGear(); renderFoodTab(); renderTips(); renderBudget();
  if(savedChecks) {
    Object.entries(savedChecks).forEach(([id,checked])=>{
      const cb=document.getElementById(id);
      if(cb){cb.checked=checked;if(checked)cb.closest('.check-item')?.querySelector('.check-label')?.classList.add('done');}
    });
    updateGearProgress();
  }
  showSaved('✓ 已加载');
  document.addEventListener('input', scheduleSave);
  document.addEventListener('change', scheduleSave);
}
init();

</script>
